name: Publish Package

permissions:
  id-token: write # Needed for npm's trusted publishing (OIDC)
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup environment
        uses: ./.github/actions/setup

      - name: check
        run: pnpm lint:check && pnpm format:check && pnpm spec:check && pnpm typecheck && pnpm vitest run

      - name: build
        run: pnpm build

      - name: publish
        run: pnpm publish --access public --no-git-checks
