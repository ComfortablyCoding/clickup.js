  /v2/task/{task_id}/merge:
    post:
      tags:
        - task
      summary: Merge Tasks
      description: Merge multiple tasks into a target task. The target task is specified by the task_id parameter, while the source tasks to be merged are provided in the request body. Custom Task IDs are not supported.
      operationId: mergeTasks
      x-sdk-method: merge
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/mergetasks
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.task.merge({ task_id: "9hv", source_task_ids: ["abc123", "def456"] });'
      parameters:
        - name: task_id
          in: path
          description: ID of the target task that other tasks will be merged into.
          required: true
          style: simple
          schema:
            type: string
            examples:
              - 9hv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_task_ids
              properties:
                source_task_ids:
                  type: array
                  description: Array of task IDs to merge into the target task.
                  items:
                    type: string
                  examples:
                    - - abc123
                      - def456
      responses:
        "200":
          description: Tasks merged successfully
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          x-clickup-corrections:
            - was: no body
