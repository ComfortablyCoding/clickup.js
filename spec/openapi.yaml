    WebhookHistoryItem:
      title: WebhookHistoryItem
      type: object
      description: One change a webhook event reports. What `data`, `before` and `after` hold depends on `field`.
      x-clickup-corrections:
        - fields: [data, source]
          was: required
          reason: A description (`content`) change has neither.
      required:
        - id
        - type
        - date
        - field
        - parent_id
        - user
      properties:
        id:
          type: string
          description: "The change's ID, a number in a string or, as for a description change, a UUID. It isn't unique to one delivery: `taskUpdated` and the more specific event, like `taskStatusUpdated`, send the same history items, and each edit of a comment sends the item its post did."
        type:
          type:
            - integer
            - "null"
          description: The kind of item that changed, like `1` for a task or `6` for a List.
        date:
          type:
            - string
            - "null"
          description: When it changed, in Unix time in milliseconds.
        field:
          type:
            - string
            - "null"
          description: "What changed: `task_creation`, `name`, `content` (the description), `status`, `priority`, `assignee_add`, `assignee_rem`, `due_date`, `time_estimate`, `tag`, `tag_removed`, `section_moved` (to another List), `comment` or `time_spent`, among others."
        parent_id:
          type:
            - string
            - "null"
          description: The ID of the changed item's parent, like a task's List.
        data:
          description: More about the change, depending on `field`.
        source:
          x-clickup-corrections:
            - was: untyped, `null` in ClickUp's examples
              reason: It's a string, `api` on the `task_creation` item of a task created through the API.
          type:
            - string
            - "null"
          description: "Where the change came from: `api` for a task created through the API, otherwise `null`."
        user:
          x-clickup-corrections:
            - fields: [role, role_subtype, profile_picture_key]
              was: left out of the example payloads
              reason: ClickUp sends the user's `role` and `role_subtype`, and `profile_picture_key` with a description change.
          description: Who made the change.
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/UserSummary"
                - type: object
                  properties:
                    role:
                      type:
                        - integer
                        - "null"
                      description: "Their role in the workspace: owner `1`, admin `2`, member `3` or guest `4`."
                    role_subtype:
                      type:
                        - integer
                        - "null"
                    profile_picture_key: {}
            - type: "null"
        before:
          description: The value before the change, depending on `field`. Left out when there's none, like for an added assignee.
        after:
          description: The value after the change, depending on `field`. Left out when there's none, like for a removed assignee.
