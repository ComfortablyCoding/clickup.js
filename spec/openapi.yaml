    FolderFolder:
      title: Subfolder
      description: |-
        A Folder nested inside another Folder, as returned in the `folders` array of a Folder response. Subfolders carry the same fields as the Folder they are nested in, including their own `folders` array, so the response describes the whole subfolder tree.

        The `space` object is not repeated on nested entries: a subfolder always belongs to the same Space as the Folder you requested.
      required:
        - id
        - name
        - orderindex
        - override_statuses
        - hidden
        - task_count
        - parent_folder
      type: object
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
        orderindex:
          type:
            - integer
            - "null"
        override_statuses:
          type:
            - boolean
            - "null"
        hidden:
          type:
            - boolean
            - "null"
        task_count:
          type:
            - string
            - "null"
        archived:
          type:
            - boolean
            - "null"
          description: Whether the Folder is archived.
        statuses:
          type:
            - array
            - "null"
          description: The statuses that apply to this subfolder. Inherited statuses are resolved, so this is populated whether or not `override_statuses` is `true`, and matches what a direct [Get Folder](#tag/Folders/operation/GetFolder) request for this subfolder returns.
          items:
            $ref: "#/components/schemas/Status"
        lists:
          type:
            - array
            - "null"
          description: Lists contained in this Folder.
          items:
            type: object
        parent_folder:
          type:
            - string
            - "null"
          description: ID of the Folder this Folder is nested inside of.
        folders:
          type:
            - array
            - "null"
          description: Subfolders nested inside this Folder, using this same shape. Empty when the Folder has no subfolders, so the array terminates the tree at every leaf.
          items:
            $ref: "#/components/schemas/FolderFolder"
      examples:
        - id: "460"
          name: Child Folder Name
          orderindex: 0
          override_statuses: false
          hidden: false
          task_count: "0"
          statuses:
