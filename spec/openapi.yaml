  /v2/folder/{folder_id}/position:
    put:
      tags:
        - folder
      summary: Move Folder
      description: |-
        Move a Folder, either by nesting it inside another Folder as a subfolder or by moving it to another Space as a top-level Folder.

        Provide `parent_folder_id` to nest the Folder inside another Folder, or `space_id` to move it to another Space as a top-level Folder. If both are provided, `parent_folder_id` takes precedence and `space_id` is ignored, so the Folder inherits the Space of its new parent Folder. Use `position` to control placement among siblings in the destination; the Folder is placed at the top when `position` is omitted.

        Nesting a Folder requires subfolder support to be enabled for the Workspace. Lists and tasks in the Folder move with it. To rename a Folder instead, use the [Update Folder](#tag/Folders/operation/UpdateFolder) endpoint.
      operationId: MoveFolder
      x-sdk-method: move
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/movefolder
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: "await clickup.folder.move({ folder_id: 457, parent_folder_id: \"457\" });"
      parameters:
        - $ref: "#/components/parameters/FolderIdPath"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              title: MoveFolderrequest
              type: object
              properties:
                parent_folder_id:
                  type: string
                  description: ID of the Folder to nest this Folder inside of, making it a subfolder. The destination Folder must be in the same Workspace. **Requires:** subfolders turned on for the Workspace.
                space_id:
                  type: string
                  description: ID of the Space to move this Folder to as a top-level Folder. Ignored when `parent_folder_id` is also provided, in which case the Folder inherits the Space of its new parent Folder.
                position:
                  type: integer
                  description: Position of the Folder among its siblings in the destination. Defaults to the top of the destination when omitted.
                custom_type_map:
                  type: object
                  description: 'Map of task type IDs in the Folder to the task type IDs to use after the move, as `{"<source_type_id>": <destination_type_id>}`. Required when moving to a destination where a task type used in the Folder is unavailable.'
                  additionalProperties:
                    type: integer
            examples:
              nest-as-subfolder:
                summary: Nest the Folder inside another Folder
                value:
                  parent_folder_id: "457"
              move-to-space:
                summary: Move the Folder to another Space as a top-level Folder
                value:
                  space_id: "790"
                  position: 0
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                contentMediaType: application/json
              example: {}
        "400":
          description: |-
            The move is not allowed. `ECODE` identifies the reason:
            * `CAT_147` - a Folder cannot be its own parent.
            * `CAT_148` - the destination Folder is a subfolder of the Folder being moved, which would create a circular reference.
            * `CAT_137` - the move would exceed the Workspace's subfolder nesting limit.
            * `CAT_158` - the move would exceed the nesting limit because of archived subfolders.
            * `CAT_159` - a Folder cannot be nested inside a hidden Folder.
            * `CAT_140` - a Sprint Folder already exists in the destination's parent chain.
            * `CAT_141` - a Sprint Folder cannot be moved into a Folder that contains a Sprint Folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV2"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
