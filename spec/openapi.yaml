  /v2/space/{space_id}/folder_template/{template_id}:
    post:
      tags:
        - space
      summary: Create Folder from template
      description: |-
        Create a new Folder using a Folder template within a Space. This endpoint allows you to create a folder with all its nested assets (lists, tasks, etc.) from a predefined template available in your Workspace. Publicly shared templates must be [added to your Workspace](https://help.clickup.com/hc/en-us/articles/6326023965591-Add-a-template-to-your-library) before you can use them with the public API.
        You can optionally create the Folder as a subfolder within an existing Folder by providing `parent_folder_id` in the request body. Subfolder support must be enabled for the Workspace.
        This request can be run asynchronously or synchronously via the `return_immediately` parameter.
      operationId: CreateFolderFromTemplate
      x-sdk-method: createFolderFromTemplate
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/createfolderfromtemplate
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.space.createFolderFromTemplate({ space_id: 789, template_id: "t-7162342", name: "..." });'
      parameters:
        - in: path
          name: space_id
          x-clickup-corrections:
            - was: a string
              reason: Also a number, like every other operation's Space ID, as IDs are all digits (live API); the URL is the same either way.
          required: true
          schema:
            type: [string, number]
          description: ID of the Space where the Folder will be created
        - in: path
          name: template_id
          required: true
          schema:
            type: string
            examples:
              - t-7162342
          description: ID of the Folder template to use. Template IDs include a `t-` prefix (e.g., `t-7162342`). Retrieve available template IDs using the [Get Folder Templates](#tag/Templates/operation/GetFolderTemplates) endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the new Folder
                parent_folder_id:
                  type: string
                  description: ID of an existing Folder to create this Folder inside of as a subfolder. The parent Folder must belong to the same Space specified in the path. **Requires:** subfolders turned on for the Workspace.
                options:
                  $ref: "#/components/schemas/TemplateOptions"
                  description: Options for creating the Folder
      responses:
        "200":
          description: Folder created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the created Folder
                  folder:
                    type:
                      - object
                      - "null"
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the Folder
                      name:
                        type:
                          - string
                          - "null"
                        description: Name of the Folder
                      orderindex:
                        type:
                          - integer
                          - "null"
                        description: Order index of the Folder
                      override_statuses:
                        type:
                          - boolean
                          - "null"
                        description: Whether the Folder overrides default statuses
                      hidden:
                        type:
                          - boolean
                          - "null"
                        description: Whether the Folder is hidden
                      space:
                        anyOf:
                          - $ref: "#/components/schemas/LocationRef"
                          - type: "null"
                      task_count:
                        type:
                          - string
                          - "null"
                        description: Number of tasks in the Folder
                      archived:
                        type:
                          - boolean
                          - "null"
                        description: Whether the Folder is archived
                      statuses:
                        type:
                          - array
                          - "null"
                        description: Statuses defined on the Folder. Only populated when `override_statuses` is `true`, which is the case when the template brings its own statuses. A Folder that inherits its statuses returns an empty array here; to get the resolved statuses, request it with [Get Folder](#tag/Folders/operation/GetFolder).
                        items:
                          $ref: "#/components/schemas/Status"
                      lists:
                        x-clickup-corrections:
                          - was: untyped
                            reason: They're Lists. Templates can't be made through the API, so not checked live.
                        type:
                          - array
                          - "null"
                        description: Lists contained in the Folder
                        items:
                          $ref: "#/components/schemas/List"
                      parent_folder:
                        type:
                          - string
                          - "null"
                        description: ID of the parent Folder if this Folder is a subfolder. Echoes the `parent_folder_id` sent in the request; note the response field is named `parent_folder`, not `parent_folder_id`. Only present when the Folder was created inside another Folder.
                      permission_level:
                        type:
                          - string
                          - "null"
                        description: Permission level for the current user
                examples:
                  - id: 90114316773
                    folder:
                      id: "90114316773"
                      name: Projects
                      orderindex: 0
                      override_statuses: true
                      hidden: false
                      space:
                        id: "90112667046"
                        name: Client Facing
                        access: true
                      task_count: "0"
                      archived: false
                      statuses:
                        - id: c90114316773_syqLtYOY
