    WebhookEventName:
      title: WebhookEventName
      type: string
      description: An event a webhook can subscribe to, and the `event` of the requests ClickUp sends it. ClickUp also sends `taskNameUpdated`, which a webhook can't subscribe to alone, to webhooks subscribed to `*`.
      enum:
