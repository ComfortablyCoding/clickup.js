        - lang: TypeScript
          label: clickup.js
          source: await clickup.timeEntry.list();
      x-clickup-corrections:
        - fields: [team_id]
          was: a query param too
          reason: It only repeats the path's Workspace ID.
        - fields: [assignee]
          was: a number
          reason: Also a string, for an ID as ClickUp sends it, or several comma-separated (`1234,9876`); the URL is the same either way.
        - fields: [folder_id, list_id, space_id]
          was: a number
          reason: Also a string, as ClickUp sends IDs; the URL is the same either way.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: start_date
          in: query
          description: Unix time in milliseconds
          style: form
          explode: true
          schema:
            type: number
        - name: end_date
          in: query
          description: Unix time in milliseconds
          style: form
          explode: true
          schema:
            type: number
        - name: assignee
          in: query
          description: |-
            Filter by `user_id`. For multiple assignees, separate `user_id` using commas.

             **Example:** `assignee=1234,9876`

            ***Note:** Only Workspace Owners/Admins have access to do this.*
          style: form
