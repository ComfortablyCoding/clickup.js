        If left out, it's filled in from the client's `workspace.id`.
      style: form
      explode: true
      schema:
        type: [string, number]
        examples:
          - 123
    WebhookSignatureHeader:
      name: X-Signature
      in: header
      description: The body's HMAC-SHA256 in hex, keyed with the webhook's `secret`, which `webhook.create` returns. `parseWebhook` and `verifyWebhook` from `clickup.js/webhooks` check it.
      required: true
      schema:
        type: string
  headers:
    X-RateLimit-Limit:
      description: The requests the token may make per minute, which depends on the Workspace's plan. Sent on every v2 response, and on v3's 429s.
      schema:
        type: integer
        examples:
          - 100
    X-RateLimit-Remaining:
      description: The requests left in the current minute. Sent on every v2 response, and on v3's 429s.
      schema:
        type: integer
        examples:
          - 99
    X-RateLimit-Reset:
      description: When the current minute's window resets, in Unix epoch seconds. Sent on every v2 response, and on v3's 429s.
      schema:
        type: integer
        examples:
          - 1792734327
