# The requests ClickUp sends to webhooks, one per event.
webhooks:
  taskCreated:
    post:
      operationId: taskCreated
      summary: Task created
      description: A task was created. Its history items are its first status, which ClickUp also sends as `taskStatusUpdated`, and one whose `field` is `task_creation`, with the `source` `api` for a task created through the API. Each history item's `parent_id` is the task's List.
      externalDocs:
        description: ClickUp's example payloads
        url: https://developer.clickup.com/docs/webhooktaskpayloads
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - task_id
                - webhook_id
                - team_id
                - history_items
              properties:
                event:
                  const: taskCreated
                task_id:
                  type: string
                  description: The task's ID.
                webhook_id:
                  type: string
                  description: The webhook's ID, as `webhook.create` returned it.
                team_id:
                  x-clickup-corrections:
                    - was: left out of the example payloads
                      reason: ClickUp sends the workspace's ID with every event.
                  type: string
                  description: The workspace's ID.
                history_items:
                  type: array
                  items:
                    $ref: "#/components/schemas/WebhookHistoryItem"
                  description: What changed.
      responses:
        "200":
          $ref: "#/components/responses/WebhookReceived"
  taskUpdated:
    post:
      operationId: taskUpdated
      summary: Task updated
      description: |-
        A task changed. ClickUp sends it with each of the other task events but `taskCreated` and `taskDeleted`, with the same history items, and for changes they don't cover, like the description or a Custom Field. Adding an attachment to a task doesn't send it, but uploading one to a task comment does.

        What `before` and `after` hold depends on `field`, so they're untyped here; subscribe to the more specific event to have them typed.
      externalDocs:
        description: ClickUp's example payloads
        url: https://developer.clickup.com/docs/webhooktaskpayloads
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - task_id
                - webhook_id
                - team_id
                - history_items
              properties:
                event:
                  const: taskUpdated
                task_id:
                  type: string
                  description: The task's ID.
                webhook_id:
                  type: string
                  description: The webhook's ID, as `webhook.create` returned it.
                team_id:
                  x-clickup-corrections:
                    - was: left out of the example payloads
                      reason: ClickUp sends the workspace's ID with every event.
                  type: string
                  description: The workspace's ID.
                history_items:
                  x-clickup-corrections:
                    - was: items without `comment`
                      reason: A history item for a comment posted or edited has the `comment`.
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/WebhookHistoryItem"
                      - type: object
                        properties:
                          comment:
                            description: The comment, when `field` is `comment`.
                            anyOf:
                              - $ref: "#/components/schemas/WebhookComment"
                              - type: "null"
                  description: What changed.
                data:
                  x-clickup-corrections:
                    - was: left out of the example payloads
                      reason: With a time entry's change, ClickUp sends it, as with `taskTimeTrackedUpdated`.
                  description: What happened to a time entry, when one changed.
                  anyOf:
                    - $ref: "#/components/schemas/WebhookTimeTrackedData"
                    - type: "null"
      responses:
        "200":
          $ref: "#/components/responses/WebhookReceived"
  taskNameUpdated:
    x-clickup-corrections:
      - was: not in ClickUp's list of events
        reason: ClickUp sends it to webhooks subscribed to `*`.
    post:
      operationId: taskNameUpdated
      summary: Task renamed
      description: A task was renamed. ClickUp also sends `taskUpdated`. A webhook can't subscribe to it alone, as `webhook.create` rejects it, but one subscribed to every event (`*`) gets it.
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - task_id
                - webhook_id
                - team_id
                - history_items
              properties:
                event:
                  const: taskNameUpdated
                task_id:
                  type: string
                  description: The task's ID.
