# The OpenAPI document clickup.js is generated from: ClickUp's v2 and v3 specs, merged once and
# corrected by hand. Edit it directly, then run `pnpm codegen`.

# Conventions:
# - Each operation's only tag is its namespace, and its `x-sdk-method` is its method: `tags: [task]`
#   with `x-sdk-method: get` becomes `clickup.task.get()` (see docs/naming.md). `operationId` stays
#   ClickUp's own, so the spec can still be compared with ClickUp's, and `externalDocs` links to
#   ClickUp's reference.
# - Every operation has a summary, a description and a clickup.js sample in `x-codeSamples`, and
#   every parameter has a description. `pnpm typecheck` checks each sample against the SDK.
# - The docs show descriptions as written, so the spec mentions what the SDK adds: `team_id` and
#   `workspace_id` params end with "If left out, it's filled in from the client's `workspace.id`.",
#   and a multipart body, always `required`, describes the `FormData` it takes.
# - Anything a call or field needs first (a plan, a ClickApp, a setting) goes on a `**Requires:** …`
#   line in its description: first in an operation's, last in a field's.
# - Path params come first in an operation's `parameters`, are required, and follow the URL's order.
# - An all-digit ID (a List's, Folder's, Space's, Workspace's, user's, comment's or guest's) is
#   `[string, number]` in path and query params: ClickUp sends IDs as strings, its docs write them as
#   numbers, and both give the same URL. Other IDs are strings, as are IDs past
#   `Number.MAX_SAFE_INTEGER`, like a time entry's, which a number would round.
# - A list call's `x-sdk-pagination` says how it pages: `page` (until `last`, or an empty page),
#   `cursor` (by `next_cursor`) or `keyset` (each param in `from` read from the last item). `items`
#   names the response's list.
# - Each resource, and each shape used in more than one place (`Task`, `UserSummary`, `Status`,
#   `Tag`, …), has a single schema that every use points to.
# - ClickUp returns `null` for many fields its specs mark as always present, so response fields are
#   nullable unless ClickUp is known to always fill them in (`id` is). New endpoints should do the
#   same.
# - Errors are `ErrorV2` or `ErrorV3`, as every operation's `default` response, and its `429` is the
#   shared `RateLimitedV2` or `RateLimitedV3`. v2 sends the `X-RateLimit-*` headers on every
#   response, v3 only on a 429. Parameters used by more than one operation live in
#   `components.parameters`.
# - Each fix to ClickUp's specs is an entry in the `x-clickup-corrections` list of whatever it fixes:
#   an operation, a parameter, a response or a schema. `was` is what ClickUp's spec had, and `reason`
#   is why it changed, noting when that's unverified, as for calls a Free Forever workspace can't
#   make. `fields` names the fields or params it's about, when it sits on the object that has them
#   rather than on each one.
# - v3 paths live under `/v3/` (ClickUp's `/api/v3/`), and their path params are lower-case.
# - `webhooks` has the request ClickUp sends for each webhook event, with the event's name as its
#   `operationId`. ClickUp's specs have none, so they're typed from its example payloads.

openapi: 3.1.1
info:
  title: ClickUp API for clickup.js
  version: "2.0"
  description: ClickUp's v2 and v3 OpenAPI documents, merged and corrected for clickup.js.
externalDocs:
  description: ClickUp's API documentation
  url: https://developer.clickup.com/docs
servers:
  - url: https://api.clickup.com/api
security:
  - token: []
tags:
  - name: acl
  - name: attachment
  - name: auditLog
  - name: authorization
  - name: chatChannel
  - name: chatMessage
  - name: checklist
  - name: comment
  - name: doc
  - name: folder
  - name: goal
  - name: guest
  - name: keyResult
  - name: list
  - name: space
  - name: task
  - name: timeEntry
  - name: user
  - name: userGroup
  - name: view
  - name: webhook
  - name: workspace
paths:
  /v2/task/{task_id}/attachment:
    post:
      tags:
        - task
      summary: Create Task Attachment
      description: |-
        Upload a file to a task as an attachment. Files stored in the cloud cannot be used in this API request.

        ***Note:** This request uses multipart/form-data as the content type.*

         ***Tip:** Try our new [V3 Attachments API](https://developer.clickup.com/reference/postentityattachment), which supports both tasks and File type Custom Fields!*
      operationId: CreateTaskAttachment
      x-sdk-method: createAttachment
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/createtaskattachment
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'const form = new FormData();

            form.append("attachment", new File(["Hello"], "hello.txt"));

            await clickup.task.createAttachment({ task_id: "9hv", data: form });'
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/CustomTaskIdsQuery"
        - $ref: "#/components/parameters/TeamIdQuery"
      x-clickup-corrections:
        - fields: [attachment]
          was: items with no schema, so typed as unknown
          reason: Attachments are files.
      requestBody:
        description: ""
        content:
          multipart/form-data:
            schema:
              description: A `FormData` with the files to attach, each as `attachment`.
              properties:
                attachment:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: CreateTaskAttachmentresponse
                required:
                  - id
                  - version
                  - date
                  - title
                  - extension
                  - thumbnail_small
                  - thumbnail_large
                  - url
                type: object
                x-clickup-corrections:
                  - fields: [name, source, thumbnail_medium, url_w_query, url_w_host]
                    was: left out
                    reason: These fields appear in ClickUp's responses, so they are included in the schema.
                properties:
                  id:
                    type: string
                  version:
                    type:
                      - string
                      - "null"
                  date:
                    type:
                      - integer
                      - "null"
                  title:
                    type:
                      - string
                      - "null"
                  extension:
                    type:
                      - string
                      - "null"
                  thumbnail_small:
                    type:
                      - string
                      - "null"
                  thumbnail_large:
                    type:
                      - string
                      - "null"
                  url:
                    type:
                      - string
                      - "null"
                  name:
                    type:
                      - string
                      - "null"
                  source:
                    type:
                      - integer
                      - "null"
                  thumbnail_medium: {}
                  url_w_query:
                    type:
                      - string
                      - "null"
                  url_w_host:
                    type:
                      - string
                      - "null"
              example:
                id: ac434d4e-8b1c-4571-951b-866b6d9f2ee6.png
                version: "0"
                date: 1569988578766
                title: image.png
                extension: png
                thumbnail_small: https://attachments-public.clickup.com/ac434d4e-8b1c-4571-951b-866b6d9f2ee6/logo_small.png
                thumbnail_large: https://attachments-public.clickup.com/ac434d4e-8b1c-4571-951b-866b6d9f2ee6/logo_small.png
                url: https://attachments-public.clickup.com/ac434d4e-8b1c-4571-951b-866b6d9f2ee6/logo_small.png
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/oauth/token:
    post:
      tags:
        - authorization
      summary: Get Access Token
      description: |-
        These are the routes for authing the API and going through the [OAuth flow](https://developer.clickup.com/docs/authentication).

        Applications utilizing a personal API token don't use this endpoint.

        ***Note:** OAuth tokens are not supported when using the [**Try It** feature](https://developer.clickup.com/docs/trytheapi) of our Reference docs. You can't try this endpoint from your web browser.*
      operationId: GetAccessToken
      x-sdk-method: createAccessToken
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/getaccesstoken
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: "await clickup.authorization.createAccessToken({

            \tclient_id: \"your_client_id\",

            \tclient_secret: \"your_client_secret\",

            \tcode: \"authorization_code\",

            });"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthPostInput"
            example:
              client_id: your_client_id
              client_secret: your_client_secret
              code: authorization_code
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OauthPostInput"
            example:
              client_id: your_client_id
              client_secret: your_client_secret
              code: authorization_code
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: GetAccessTokenresponse
                required:
                  - access_token
                type: object
                properties:
                  access_token:
                    type:
                      - string
                      - "null"
              example:
                access_token: access token
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
      x-hideTryItPanel: true
  /v2/user:
    get:
      tags:
        - authorization
      summary: Get Authorized User
      description: View the details of the authenticated user's ClickUp account.
      operationId: GetAuthorizedUser
      x-sdk-method: getUser
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/getauthorizeduser
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: await clickup.authorization.getUser();
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: GetAuthorizedUserresponse
                type: object
                properties:
                  user:
                    anyOf:
                      - $ref: "#/components/schemas/User"
                      - type: "null"
              example:
                user:
                  id: 123
                  username: John Doe
                  email: user@company.com
                  color: "#000000"
                  profilePicture: https://clickup.com/avatar.jpg
                  initials: JD
                  week_start_day: 0
                  global_font_support: false
                  timezone: America/Los_Angeles
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/team:
    get:
      tags:
        - workspace
      summary: Get Authorized Workspaces
      description: View the Workspaces available to the authenticated user.
      operationId: GetAuthorizedTeams
      x-sdk-method: list
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/getauthorizedteams
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: await clickup.workspace.list();
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: GetAuthorizedTeamsresponse
                required:
                  - teams
                type: object
                properties:
                  teams:
                    type:
                      - array
                      - "null"
                    items:
                      $ref: "#/components/schemas/Workspace"
                    description: ""
              example:
                teams:
                  - id: "1234"
                    name: My ClickUp Workspace
                    color: "#000000"
                    avatar: https://clickup.com/avatar.jpg
                    members:
                      - user:
                          id: 123
                          username: John Doe
                          color: "#000000"
                          profilePicture: https://clickup.com/avatar.jpg
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/task/{task_id}/checklist:
    post:
      tags:
        - task
      summary: Create Checklist
      description: Add a checklist to a task; add its items with `checklist.createItem`. Returns the new checklist.
      operationId: CreateChecklist
      x-sdk-method: createChecklist
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/createchecklist
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.task.createChecklist({ task_id: "9hz", name: "Checklist" });'
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/CustomTaskIdsQuery"
        - $ref: "#/components/parameters/TeamIdQuery"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              title: CreateChecklistrequest
              type: object
              x-clickup-corrections:
                - fields: [name]
                  was: required
                  reason: ClickUp accepts the call without this field.
              properties:
                name:
                  type: string
            example:
              name: Checklist
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: CreateChecklistresponse
                required:
                  - checklist
                type: object
                properties:
                  checklist:
                    $ref: "#/components/schemas/Checklist"
              example:
                checklist:
                  id: b955c4dc-b8a8-48d8-a0c6-b4200788a683
                  task_id: 9hz
                  name: Checklist
                  orderindex: 0
                  resolved: 0
                  unresolved: 0
                  items: []
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/checklist/{checklist_id}:
    put:
      tags:
        - checklist
      summary: Edit Checklist
      description: Rename a task checklist, or reorder a checklist so it appears above or below other checklists on a task.
      operationId: EditChecklist
      x-sdk-method: update
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/editchecklist
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.checklist.update({ checklist_id: "b955c4dc", name: "Updated Checklist", position: 1 });'
      parameters:
        - $ref: "#/components/parameters/ChecklistIdPath"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              title: EditChecklistrequest
              type: object
              properties:
                name:
                  type: string
                position:
                  description: |-
                    Position refers to the order of appearance of checklists on a task.

                    To set a checklist to appear at the top of the checklists section of a task, use `"position": 0`.
                  type: integer
            example:
              name: Updated Checklist
              position: 1
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              x-clickup-corrections:
                - was: untyped
                  reason: It returns the checklist.
              schema:
                type: object
                properties:
                  checklist:
                    $ref: "#/components/schemas/Checklist"
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
    delete:
      tags:
        - checklist
      summary: Delete Checklist
      description: Delete a checklist and its items from its task. Returns an empty object.
      operationId: DeleteChecklist
      x-sdk-method: delete
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/deletechecklist
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.checklist.delete({ checklist_id: "b955c4dc" });'
      parameters:
        - $ref: "#/components/parameters/ChecklistIdPath"
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                contentMediaType: application/json
              example: {}
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/checklist/{checklist_id}/checklist_item:
    post:
      tags:
        - checklist
      summary: Create Checklist Item
      description: Add an item to a checklist, optionally assigned to a user. Returns the whole checklist, with its items.
      operationId: CreateChecklistItem
      x-sdk-method: createItem
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/createchecklistitem
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.checklist.createItem({ checklist_id: "b955c4dc", name: "Checklist Item", assignee: 183 });'
      parameters:
        - $ref: "#/components/parameters/ChecklistIdPath"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              title: CreateChecklistItemrequest
              type: object
              properties:
                name:
                  type: string
                assignee:
                  type: integer
            example:
              name: Checklist Item
              assignee: 183
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: CreateChecklistItemresponse
                required:
                  - checklist
                type: object
                properties:
                  checklist:
                    $ref: "#/components/schemas/Checklist"
              example:
                checklist:
                  id: b955c4dc-b8a8-48d8-a0c6-b4200788a683
                  task_id: 9hv
                  name: Checklist
                  date_created: "1567711563204"
                  orderindex: 0
                  resolved: 0
                  unresolved: 1
                  items:
                    - id: 21e08dc8-e491-47f5-9fd8-d1dc4cedcc6f
                      name: Checklist Item
                      orderindex: 0
                      assignee:
                        id: 183
                        username: John Doe
                        email: example@email.com
                        color: "#827718"
                        initials: JD
                        profilePicture: https://attachments.clickup.com/profilePictures/183_nx1.jpg
                      resolved: false
                      parent: null
                      date_created: "1567711566859"
                      children: []
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/checklist/{checklist_id}/checklist_item/{checklist_item_id}:
    put:
      tags:
        - checklist
      summary: Edit Checklist Item
      description: |-
        Update an individual line item in a task checklist.

        You can rename it, set the assignee, mark it as resolved, or nest it under another checklist item.
      operationId: EditChecklistItem
      x-sdk-method: updateItem
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/editchecklistitem
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: "await clickup.checklist.updateItem({

            \tchecklist_id: \"b955c4dc\",

            \tchecklist_item_id: \"21e08dc8\",

            \tname: \"Updated Checklist Item\",

            \tassignee: null,

            \tresolved: true,

            \tparent: null,

            });"
      parameters:
        - $ref: "#/components/parameters/ChecklistIdPath"
        - $ref: "#/components/parameters/ChecklistItemIdPath"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              title: EditChecklistItemrequest
              type: object
              properties:
                name:
                  type: string
                assignee:
                  type:
                    - string
                    - "null"
                resolved:
                  type: boolean
                parent:
                  description: To nest a checklist item under another checklist item, include the other item's `checklist_item_id`.
                  type:
                    - string
                    - "null"
            example:
              name: Updated Checklist Item
              assignee: null
              resolved: true
              parent: null
        required: true
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                title: EditChecklistItemresponse
                required:
                  - checklist
                type: object
                properties:
                  checklist:
                    $ref: "#/components/schemas/Checklist"
              example:
                checklist:
                  id: b955c4dc-b8a8-48d8-a0c6-b4200788a683
                  task_id: 9hv
                  name: Checklist
                  date_created: "1567711563204"
                  orderindex: 0
                  resolved: 1
                  unresolved: 0
                  items:
                    - id: 21e08dc8-e491-47f5-9fd8-d1dc4cedcc6f
                      name: Updated Checklist Item
                      orderindex: 0
                      assignee: null
                      resolved: true
                      parent: null
                      date_created: "1567711566859"
                      children: []
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
    delete:
      tags:
        - checklist
      summary: Delete Checklist Item
      description: Delete a line item from a task checklist.
      operationId: DeleteChecklistItem
      x-sdk-method: deleteItem
      externalDocs:
        description: ClickUp's reference
        url: https://developer.clickup.com/reference/deletechecklistitem
      x-codeSamples:
        - lang: TypeScript
          label: clickup.js
          source: 'await clickup.checklist.deleteItem({ checklist_id: "b955c4dc", checklist_item_id: "21e08dc8" });'
      parameters:
        - $ref: "#/components/parameters/ChecklistIdPath"
        - $ref: "#/components/parameters/ChecklistItemIdPath"
      responses:
        "200":
          description: ""
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                contentMediaType: application/json
              example: {}
        "429":
          $ref: "#/components/responses/RateLimitedV2"
        default:
          $ref: "#/components/responses/ErrorV2"
  /v2/task/{task_id}/comment:
    get:
      tags:
        - task
      summary: Get Task Comments
      description: |-
        View task comments.

        Retrieve comments from a task. Results are returned in reverse chronological order (newest to oldest). By default, the request returns the 25 most recent comments.

        [Pagination](https://developer.clickup.com/docs/task-comments-pagination): To fetch the next page of history (older comments), you must use the `start` and `start_id` parameters together, using the data from the last comment of the current response.
